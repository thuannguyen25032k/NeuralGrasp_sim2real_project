services:
  neuralgrasp:
    image: neuralgrasp:cu117
    container_name: neuralgrasp
    build:
      context: .
      dockerfile: ./Dockerfile

    # Project path inside container
    working_dir: /app

    environment:
      DISPLAY: ":4"
      NVIDIA_DRIVER_CAPABILITIES: "all"
      NVIDIA_VISIBLE_DEVICES: "all"

    stdin_open: true
    tty: true
    restart: unless-stopped

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - .:/app/
      # Protect the image-built venv from being overwritten by the .:/app/ bind mount.
      # This anonymous volume shadows /app/.venv so the container always uses
      # the venv that was compiled into the image (with the correct torch+CUDA versions).
      - /app/.venv

    ports:
      - "2403:6001"

    devices:
      - /dev/dri/card0:/dev/dri/card0
      - /dev/dri/card1:/dev/dri/card1
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/renderD129:/dev/dri/renderD129

    # Docker Compose v2 GPU support
    gpus: all

    # Increase shared memory size to prevent SIGBUS when PyTorch multiprocessing
    # shares tensors across eval workers (default Docker /dev/shm is only 64MB).
    # Mounting /dev/shm as tmpfs without a size limit makes it bounded only by
    # available host RAM (122 GB on this machine).
    tmpfs:
      - /dev/shm

    # Default startup command (interactive shell)
    command: /bin/bash

