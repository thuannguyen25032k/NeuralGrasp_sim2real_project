
name: 'ManiFlow_BC'

use_fabric: True

use_depth: True
use_neural_rendering: True
num_view_for_nerf: 20

# Language encoder
# choices: T5 (768), CLIP (512)
language_model: 'CLIP'
language_model_dim: 512

# Voxelization
image_crop_size: 64
bounds_offset: [0.15]
voxel_sizes: [100]
include_prev_layer: False

# 3D-CNN encoder (same architecture as ManiGaussian_BC)
voxel_patch_size: 5
voxel_patch_stride: 5
final_dim: 128
lang_fusion_type: 'seq'   # 'seq' or 'concat'

# -----------------------------------------------------------------------
# Flow-matching head  (Transformer — mirrors 3D FlowMatch Actor)
# -----------------------------------------------------------------------
# Architecture overview:
#   VoxelFlowEncoder:
#     ├── 3D-CNN voxel encoder  (im_channels output, shared with GS renderer)
#     ├── Language pre-processor (lang_fusion_type: 'seq' or 'concat')
#     ├── Voxel → token projection  (AdaptiveAvgPool3d + Linear → embedding_dim)
#     │     token count = (voxel_sizes / voxel_token_downsample)^3
#     │     then FPS-subsampled to num_fps_tokens
#     ├── 3D RoPE positional encoding on voxel token world coords
#     └── TransformerHead (denoising head):
#           action query
#             → cross-attn to lang tokens   (1 layer, no RoPE)
#             → cross-attn to voxel tokens  (2 layers, 3D RoPE, AdaLN)
#             → joint self-attn trunk       (num_shared_attn_layers, AdaLN)
#             → pos head  (2-layer self-attn → Linear → 3)
#             → rot head  (2-layer self-attn → Linear → 4)
#             → grip head (Linear → 1)
#   AdaLN conditioning signal = time_emb(t) + proprio_proj(gripper_state)
# -----------------------------------------------------------------------
action_dim: 8             # [x, y, z, qx, qy, qz, qw, gripper]

# --- Transformer head hyperparameters -----------------------------------
# embedding_dim: feature dimension for all Transformer layers.
#   Must be divisible by num_attn_heads.
#   Larger = more capacity, higher memory/compute cost.
embedding_dim: 120

# num_attn_heads: number of attention heads in every AttentionModule.
#   embedding_dim / num_attn_heads = head dimension (here: 15).
num_attn_heads: 8

# num_shared_attn_layers: depth of the joint action+voxel self-attention
#   trunk (AdaLN, 3D RoPE). Mirrors TransformerHead.self_attn depth.
num_shared_attn_layers: 4

# voxel_token_downsample: spatial stride applied via AdaptiveAvgPool3d
#   before flattening the 3D-CNN voxel volume into a token sequence.
#   Token count N = (voxel_size / voxel_token_downsample)^3
#   e.g. voxel_size=100, stride=5  →  N = 20^3 = 8000 tokens (before FPS).
voxel_token_downsample: 5

# num_fps_tokens: how many voxel tokens to keep after Farthest Point
#   Sampling (FPS) — reduces computation from N to M in the self-attn trunk.
#   Set to 0 to disable FPS and keep all N tokens.
num_fps_tokens: 512

# denoise_timesteps: number of rectified-flow denoising steps at inference.
#   Does not affect training (training uses a single random t ~ U[0,1]).
denoise_timesteps: 100

# --- Legacy MLP stubs (NOT used — kept only for YAML backward-compat) ---
# These keys were present in an earlier MLP-based prototype.
# VoxelFlowEncoder accepts them as kwargs but ignores them entirely.
flow_context_dim: 256   # ignored
flow_hidden_dim: 512    # ignored
flow_num_layers: 4      # ignored

# Flow-matching loss weights
pos_loss_weight: 30.0
rot_loss_weight: 10.0
grip_loss_weight: 1.0

# -----------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------
activation: lrelu
norm: None

lr: 0.0005
lr_scheduler: False
num_warmup_steps: 3000
optimizer: 'lamb'           # 'lamb' or 'adam'
lambda_weight_l2: 0.000001

# BC loss coefficient
lambda_bc: 1.0

# Augmentation
crop_augmentation: True
transform_augmentation:
  apply_se3: True
  aug_xyz: [0.125, 0.125, 0.125]
  aug_rpy: [0.0, 0.0, 45.0]
  aug_rot_resolution: 5     # kept for SE3 augmentation utility

demo_augmentation: True
demo_augmentation_every_n: 10

# Misc
rotation_resolution: 5      # kept for replay/augmentation helpers
no_skip_connection: False
keypoint_method: 'heuristic'

# Logging
use_wandb: True

# -----------------------------------------------------------------------
# Gaussian Splatting auxiliary renderer (unchanged from ManiGaussian_BC)
# -----------------------------------------------------------------------
neural_renderer:
  visdom: False
  render_freq: 1000

  use_clip: False
  use_dynamic_field: False

  lambda_nerf: 0.01
  lambda_embed: 0.01
  lambda_rgb: 1.0
  lambda_l1: 1.0
  lambda_ssim: 0.0
  lambda_dyna: 0.01
  lambda_reg: 0.0

  dataset:
    use_processed_data: True
    bg_color: [0, 0, 0]
    zfar: 4.0
    znear: 0.1
    trans: [0.0, 0.0, 0.0]
    scale: 1.0
    mask_gt_rgb: False

  foundation_model_name: null
  d_embed: 3
  loss_embed_fn: cosine

  d_latent: 128
  d_lang: 128

  voxel_shape: 100
  image_width: 128
  image_height: 128
  coordinate_bounds: [-0.3, -0.5, 0.6, 0.7, 0.5, 1.6]

  use_code: True
  use_code_viewdirs: False
  use_xyz: True

  mlp:
    n_blocks: 5
    d_hidden: 512
    combine_layer: 3
    combine_type: average
    beta: 0.0
    use_spade: False
    opacity_scale: 1.0
    opacity_bias: -2.0
    scale_bias: 0.02
    scale_scale: 0.003
    xyz_scale: 0.1
    xyz_bias: 0.0
    max_sh_degree: 1

  next_mlp:
    d_in: 3
    d_lang: 128
    d_out: 3
    n_blocks: 5
    d_hidden: 512
    combine_layer: 3
    combine_type: average
    beta: 0.0
    use_spade: False
    warm_up: 3000
    use_action: True

  code:
    num_freqs: 6
    freq_factor: 1.5
    include_input: True
