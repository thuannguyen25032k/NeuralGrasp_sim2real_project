
name: 'ManiFlow_BC'

use_fabric: True

use_depth: False  # depth is fully redundant: point_cloud already encodes XYZ in world space
use_neural_rendering: True
num_view_for_nerf: 20

# Language encoder
# choices: T5 (768), CLIP (512)
language_model: 'CLIP'
language_model_dim: 512

# Voxelization
image_crop_size: 64
bounds_offset: [0.15]
voxel_sizes: [100]
include_prev_layer: False

# 3D-CNN encoder (same architecture as ManiGaussian_BC)
voxel_patch_size: 5
voxel_patch_stride: 5
final_dim: 128
lang_fusion_type: 'seq'   # 'seq' or 'concat'

# -----------------------------------------------------------------------
# Flow-matching head  (Transformer — mirrors 3D FlowMatch Actor)
# -----------------------------------------------------------------------
# Architecture overview:
#   VoxelFlowEncoder:
#     ├── 3D-CNN voxel encoder  (im_channels output, shared with GS renderer)
#     ├── Language pre-processor (lang_fusion_type: 'seq' or 'concat')
#     ├── Voxel → token projection  (AdaptiveAvgPool3d + Linear → embedding_dim)
#     │     token count = (voxel_sizes / voxel_token_downsample)^3
#     │     then FPS-subsampled to num_fps_tokens
#     ├── 3D RoPE positional encoding on voxel token world coords
#     └── TransformerHead (denoising head):
#           action query
#             → cross-attn to lang tokens   (1 layer, no RoPE)
#             → cross-attn to voxel tokens  (2 layers, 3D RoPE, AdaLN)
#             → joint self-attn trunk       (num_shared_attn_layers, AdaLN)
#             → pos head  (2-layer self-attn → Linear → 3)
#             → rot head  (2-layer self-attn → Linear → 6, ortho6D)
#             → grip head (Linear → 1)
#   AdaLN conditioning signal = time_emb(t) + proprio_proj(gripper_state)
# -----------------------------------------------------------------------
action_dim: 8             # [x, y, z, qx, qy, qz, qw, gripper]

# --- Transformer head hyperparameters -----------------------------------
# embedding_dim: feature dimension for all Transformer layers.
#   Must be divisible by num_attn_heads.
#   Larger = more capacity, higher memory/compute cost.
#   120 → ~2M params (too small); 192 → ~6M; 256 → ~14M (matches typical
#   3D FlowMatch Actor scale for single-task learning).
#   NOTE: existing checkpoints were trained with 256. Change only when
#   starting a fresh training run — mismatching causes all transformer
#   weights to be silently dropped at eval (shape mismatch → random init).
embedding_dim: 256

# num_attn_heads: number of attention heads in every AttentionModule.
#   embedding_dim / num_attn_heads = head dimension.
#   256 / 8 = 32  (current setting — matches all checkpoints in maniflow_run1).
#   NOTE: keep in sync with embedding_dim and checkpoints.
num_attn_heads: 8

# num_shared_attn_layers: depth of the joint action+voxel self-attention
#   trunk (AdaLN, 3D RoPE). Mirrors TransformerHead.self_attn depth.
num_shared_attn_layers: 4

# voxel_token_downsample: spatial stride applied via AdaptiveAvgPool3d
#   before flattening the 3D-CNN voxel volume into a token sequence.
#   Token count N = (voxel_size / voxel_token_downsample)^3
#   e.g. voxel_size=100, stride=5  →  N = 20^3 = 8000 tokens (before FPS).
voxel_token_downsample: 5

# num_fps_tokens: how many voxel tokens to keep after Farthest Point
#   Sampling (FPS) — reduces computation from N to M in the self-attn trunk.
#   Set to 0 to disable FPS and keep all N tokens.
num_fps_tokens: 512

# -----------------------------------------------------------------------
# CLIP backbone option (replaces 3D-CNN with CLIP RN50 + feature lifter)
# -----------------------------------------------------------------------
# use_clip_backbone: if True, run CLIP RN50 on the raw 2D RGB image and
#   lift the 2D features into the 3D voxel volume via point-cloud backprojection.
#   This replaces MultiLayer3DEncoderShallow with CLIPVoxelLifter.
#   The rest of VoxelFlowEncoder (Transformer head, GS renderer) is unchanged.
#   Requires rgb and pcd to be passed through QFunctionFlow.encode_scene.
#
# finetune_clip_backbone: allow gradients through the CLIP ResNet50.
#   Keep False (frozen) for 20-demo training to avoid overfitting.
use_clip_backbone: False
finetune_clip_backbone: False

# denoise_timesteps: number of rectified-flow denoising steps at inference.
#   Does not affect training (training uses a single random t ~ U[0,1]).
denoise_timesteps: 50

# action_chunk_size: number of action steps to predict per denoising call.
#   T=1  → single next-step prediction (backward-compatible default).
#   T>1  → predict a chunk / trajectory of T future steps; only the first
#           step is executed at inference time.
action_chunk_size: 1

# lv2_batch_size: number of inner noise re-sampling iterations in the loss.
#   Each iteration re-samples a new noise tensor and a new timestep, but
#   reuses the same encoded scene context — effectively multiplying the
#   gradient diversity by N without re-running the 3D-CNN encoder.
#   1 = no inner loop (standard RF loss); 2-4 = recommended for better grad.
lv2_batch_size: 4

# workspace_bounds: [x_min, y_min, z_min, x_max, y_max, z_max]
#   Used to normalise xyz to [-1, 1] before the rectified-flow process.
#   Must match the rlbench.scene_bounds used during data collection.
#   Defaults to scene_bounds if not set here.
workspace_bounds: [-0.3, -0.5, 0.6, 0.7, 0.5, 1.6]

# --- Legacy MLP stubs (NOT used — kept only for YAML backward-compat) ---
# These keys were present in an earlier MLP-based prototype.
# VoxelFlowEncoder accepts them as kwargs but ignores them entirely.
flow_context_dim: 256   # ignored
flow_hidden_dim: 512    # ignored
flow_num_layers: 4      # ignored

# Flow-matching loss weights (matching base_denoise_actor defaults exactly)
# pos_loss_weight=30, grip_loss_weight=1 match the original 3D FlowMatch Actor.
pos_loss_weight: 30.0
rot_loss_weight: 10.0
grip_loss_weight: 1.0

# -----------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------
activation: lrelu
norm: None

# Reference 3D FlowMatch Actor uses lr=1e-4 with a constant LR schedule
# and Adam optimizer — NOT LAMB and NOT cosine.
# LAMB + lr=0.005 (the PerAct default) is 50x too high for a flow-matching
# Transformer and causes the loss to plateau after ~2k steps.
lr: 0.0001
lr_scheduler: False         # constant LR — matches reference exactly
num_warmup_steps: 0
optimizer: 'adam'           # 'adam' matches reference; 'lamb' overshoots
lambda_weight_l2: 0.000001

# BC loss coefficient
lambda_bc: 1.0

# Augmentation
crop_augmentation: True
transform_augmentation:
  apply_se3: True
  aug_xyz: [0.125, 0.125, 0.125]
  aug_rpy: [0.0, 0.0, 45.0]
  aug_rot_resolution: 5     # kept for SE3 augmentation utility

demo_augmentation: True
demo_augmentation_every_n: 10

# Misc
rotation_resolution: 5      # kept for replay/augmentation helpers
no_skip_connection: False
keypoint_method: 'heuristic'

# Logging
use_wandb: True

# -----------------------------------------------------------------------
# Gaussian Splatting auxiliary renderer (unchanged from ManiGaussian_BC)
# -----------------------------------------------------------------------
neural_renderer:
  visdom: False
  render_freq: 1000

  use_clip: False
  use_dynamic_field: False

  # -----------------------------------------------------------------------
  # NeRF auxiliary loss weights
  # -----------------------------------------------------------------------
  # lambda_nerf: outer weight on the entire nerf_loss before adding to
  #   total_loss.  Keep small so the GS renderer doesn't distort the BC
  #   policy gradient.  0.02 gives the renderer ~0.1% of total gradient,
  #   enough to train the GS model without interfering with flow_loss.
  #
  # lambda_rgb: weight on per-pixel L2 reconstruction inside nerf_loss.
  #   Already the dominant NeRF signal, keep at 1.0.
  #
  # lambda_embed: weight on cosine embed loss INSIDE nerf_loss.
  #   Effective total weight = lambda_nerf × lambda_embed.
  #   Old: 0.01 × 0.01 = 0.0001  (negligible — embed never trained).
  #   New: 0.02 × 0.5  = 0.01    (10× larger, meaningful signal).
  # -----------------------------------------------------------------------
  lambda_nerf: 0.02
  lambda_embed: 0.5
  lambda_rgb: 1.0
  lambda_l1: 1.0
  lambda_ssim: 0.0
  lambda_dyna: 0.01
  lambda_reg: 0.0

  dataset:
    use_processed_data: True
    bg_color: [0, 0, 0]
    zfar: 4.0
    znear: 0.1
    trans: [0.0, 0.0, 0.0]
    scale: 1.0
    mask_gt_rgb: False

  foundation_model_name: 'diffusion' # 'diffusion' matches maniflow_run1 checkpoints; null disables feature lifting
  d_embed: 3
  loss_embed_fn: cosine

  d_latent: 128
  d_lang: 128

  voxel_shape: 100
  image_width: 128
  image_height: 128
  coordinate_bounds: [-0.3, -0.5, 0.6, 0.7, 0.5, 1.6]

  use_code: True
  use_code_viewdirs: False
  use_xyz: True

  mlp:
    n_blocks: 5
    d_hidden: 512
    combine_layer: 3
    combine_type: average
    beta: 0.0
    use_spade: False
    opacity_scale: 1.0
    opacity_bias: -2.0
    scale_bias: 0.02
    scale_scale: 0.003
    xyz_scale: 0.1
    xyz_bias: 0.0
    max_sh_degree: 1

  next_mlp:
    d_in: 3
    d_lang: 128
    d_out: 3
    n_blocks: 5
    d_hidden: 512
    combine_layer: 3
    combine_type: average
    beta: 0.0
    use_spade: False
    warm_up: 3000
    use_action: True

  code:
    num_freqs: 6
    freq_factor: 1.5
    include_input: True
