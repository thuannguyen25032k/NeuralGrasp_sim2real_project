
name: 'ManiFlow_BC'

use_fabric: True

use_depth: True
use_neural_rendering: True
num_view_for_nerf: 20

# Language encoder (CLIP: 512-dim)
language_model: 'CLIP'
language_model_dim: 512

# Voxelization
image_crop_size: 64
bounds_offset: [0.15]
voxel_sizes: [100]
include_prev_layer: False

# 3D-CNN encoder
voxel_patch_size: 5
voxel_patch_stride: 5
final_dim: 192              # was 128 — larger 3D-CNN backbone features
lang_fusion_type: 'seq'

# -----------------------------------------------------------------------
# Flow-matching head (Transformer — mirrors 3D FlowMatch Actor)
# -----------------------------------------------------------------------
embedding_dim: 256          # was 192 — wider Transformer (must be divisible by num_attn_heads)
action_dim: 8               # [x, y, z, qx, qy, qz, qw, gripper]
num_attn_heads: 8
num_shared_attn_layers: 6   # was 4 — deeper denoising trunk
voxel_token_downsample: 5
num_fps_tokens: 512
denoise_timesteps: 20       # inference only; training uses random t ~ U[0,1]
action_chunk_size: 1
lv2_batch_size: 3           # inner noise re-sampling iterations per step
workspace_bounds: [-0.3, -0.5, 0.6, 0.7, 0.5, 1.6]

# Flow-matching loss weights
pos_loss_weight: 30.0
rot_loss_weight: 20.0
grip_loss_weight: 1.0
grip_threshold: 0.5

# EMA (0.0 to disable)
ema_decay: 0.999

# -----------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------
activation: lrelu
norm: None
lr: 0.0001
lr_scheduler: False
num_warmup_steps: 0
optimizer: 'adam'
lambda_weight_l2: 0.000001
lambda_bc: 1.0

# Augmentation
crop_augmentation: True
transform_augmentation:
  apply_se3: True
  aug_xyz: [0.05, 0.05, 0.05]
  aug_rpy: [0.0, 0.0, 45.0]
  aug_rot_resolution: 5

demo_augmentation: True
demo_augmentation_every_n: 10

# Misc
rotation_resolution: 5
no_skip_connection: False
keypoint_method: 'heuristic'

# Logging
use_wandb: True

# -----------------------------------------------------------------------
# Gaussian Splatting auxiliary renderer
# -----------------------------------------------------------------------
neural_renderer:
  visdom: False
  render_freq: 1000
  use_clip: False
  use_dynamic_field: False

  # Loss weights (total GS loss = lambda_nerf * (lambda_rgb * L_rgb + lambda_embed * L_embed))
  lambda_nerf: 0.1
  lambda_rgb: 1.0
  lambda_embed: 0.5
  lambda_dyna: 0.01
  lambda_reg: 0.0

  dataset:
    use_processed_data: True
    bg_color: [0, 0, 0]
    zfar: 4.0
    znear: 0.1
    trans: [0.0, 0.0, 0.0]
    scale: 1.0
    mask_gt_rgb: False

  foundation_model_name: 'diffusion'  # null | 'diffusion' | 'dinov2'
  d_embed: 3   # CUDA GS rasterizer hardcodes language_feature_precomp to [N,3]
  loss_embed_fn: cosine

  d_latent: 128
  d_lang: 128
  voxel_shape: 100
  image_width: 128
  image_height: 128
  coordinate_bounds: [-0.3, -0.5, 0.6, 0.7, 0.5, 1.6]

  use_code: True
  use_xyz: True

  mlp:
    n_blocks: 5
    d_hidden: 512
    combine_layer: 3
    combine_type: average
    beta: 0.0
    use_spade: False
    opacity_scale: 1.0
    opacity_bias: 0.0
    scale_bias: 0.03
    scale_scale: 0.003
    xyz_scale: 0.1
    xyz_bias: 0.0
    max_sh_degree: 1

  # Dynamic field MLP (only used when use_dynamic_field: True)
  next_mlp:
    n_blocks: 5
    d_hidden: 512
    combine_layer: 3
    combine_type: average
    beta: 0.0
    use_spade: False
    warm_up: 3000
    use_action: True

  code:
    num_freqs: 6
    freq_factor: 1.5
    include_input: True
